<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Kaufland-Filialen mit Extra-Angebote-Prospekt in der Nähe finden. Inoffizielles Projekt."
    />
    <title>Kaufland Extra Finder (inoffiziell)</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <a class="skip-link" href="#results">Zu den Ergebnissen springen</a>

    <header class="app-bar">
      <div class="wrap app-bar__inner">
        <span class="app-bar__mark" data-icon="location_on"></span>
        <div>
          <h1 class="app-bar__title">Kaufland Extra Finder</h1>
          <p class="app-bar__subtitle">
            Filialen mit <strong>Extra-Angebote</strong>-Prospekt in der Nähe · inoffiziell
          </p>
        </div>
      </div>
      <div class="wrap">
        <div class="tabs" id="tabs" role="tablist" aria-label="Ansicht">
          <button
            type="button"
            role="tab"
            class="tab"
            id="tab-search"
            data-tab="search"
            aria-controls="panel-search"
            aria-selected="true"
          >
            <span data-icon="near_me"></span>Umkreissuche
          </button>
          <button
            type="button"
            role="tab"
            class="tab"
            id="tab-all"
            data-tab="all"
            aria-controls="panel-all"
            aria-selected="false"
            tabindex="-1"
          >
            <span data-icon="format_list_bulleted"></span>Alle Extra-Filialen
          </button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <div id="panel-search" role="tabpanel" aria-labelledby="tab-search">
        <section class="card search-card" aria-label="Suche">
          <form id="search-form" novalidate>
            <div class="search-row">
              <div class="search-row__field">
                <div class="text-field">
                  <input
                    id="plz"
                    name="plz"
                    type="text"
                    inputmode="numeric"
                    autocomplete="postal-code"
                    pattern="[0-9]{5}"
                    maxlength="5"
                    placeholder=" "
                    required
                    aria-describedby="plz-hint plz-error"
                  />
                  <label for="plz">Postleitzahl</label>
                </div>
                <p id="plz-hint" class="supporting-text">5-stellig, z. B. 76137</p>
                <p id="plz-error" class="supporting-text supporting-text--error" hidden></p>
              </div>
              <button type="submit" class="btn btn--filled">
                <span data-icon="search"></span>Suchen
              </button>
              <button type="button" id="locate" class="btn btn--tonal">
                <span data-icon="my_location"></span>Meinen Standort verwenden
              </button>
            </div>

            <div class="search-options">
              <fieldset class="outlined segmented">
                <legend class="outlined__label">Umkreis</legend>
                <div class="segmented__group">
                  <label class="segment">
                    <input type="radio" name="radius" value="10" />
                    <span class="segment__check" data-icon="check"></span>10 km
                  </label>
                  <label class="segment">
                    <input type="radio" name="radius" value="25" checked />
                    <span class="segment__check" data-icon="check"></span>25 km
                  </label>
                  <label class="segment">
                    <input type="radio" name="radius" value="50" />
                    <span class="segment__check" data-icon="check"></span>50 km
                  </label>
                  <label class="segment">
                    <input type="radio" name="radius" value="100" />
                    <span class="segment__check" data-icon="check"></span>100 km
                  </label>
                </div>
              </fieldset>

              <fieldset class="outlined switch-field">
                <legend class="outlined__label">PDF-Prüfung</legend>
                <label class="switch">
                  <input type="checkbox" role="switch" class="switch__input" id="pdf-only-search" />
                  <span class="switch__track" aria-hidden="true"
                    ><span class="switch__thumb"></span
                  ></span>
                  <span class="switch__label"
                    >Nur Filialen, für die der Prospekt laut PDF gilt</span
                  >
                </label>
              </fieldset>
            </div>
          </form>
        </section>

        <div class="status-bar">
          <div class="banner" id="status-box">
            <span class="banner__icon" data-icon="search"></span>
            <p id="status" role="status" aria-live="polite">Daten werden geladen …</p>
          </div>
          <div class="banner" id="data-age-box">
            <span class="banner__icon" data-icon="schedule"></span>
            <p id="data-age">Wird geladen …</p>
          </div>
        </div>

        <section id="results" class="results" aria-label="Ergebnisse" tabindex="-1">
          <div id="map" class="map" role="region" aria-label="Karte der Filialen" hidden></div>
          <ol id="list" class="list"></ol>
        </section>
      </div>

      <div id="panel-all" role="tabpanel" aria-labelledby="tab-all" hidden>
        <section class="card list-card" aria-labelledby="all-title">
          <div class="list-card__header">
            <div>
              <h2 id="all-title" class="list-card__title">Alle Extra-Filialen</h2>
              <p id="all-meta" class="list-card__meta">Daten werden geladen …</p>
            </div>
            <div class="list-card__controls">
              <fieldset class="outlined segmented segmented--inline">
                <legend class="outlined__label">Sortierung</legend>
                <div class="segmented__group" id="sort">
                  <label class="segment">
                    <input type="radio" name="sort" value="plz-asc" checked />
                    <span class="segment__check" data-icon="check"></span>
                    <span data-icon="arrow_upward"></span>PLZ aufsteigend
                  </label>
                  <label class="segment">
                    <input type="radio" name="sort" value="plz-desc" />
                    <span class="segment__check" data-icon="check"></span>
                    <span data-icon="arrow_downward"></span>PLZ absteigend
                  </label>
                </div>
              </fieldset>
              <fieldset class="outlined switch-field">
                <legend class="outlined__label">PDF-Prüfung</legend>
                <label class="switch">
                  <input type="checkbox" role="switch" class="switch__input" id="pdf-only-all" />
                  <span class="switch__track" aria-hidden="true"
                    ><span class="switch__thumb"></span
                  ></span>
                  <span class="switch__label"
                    >Nur Filialen, für die der Prospekt laut PDF gilt</span
                  >
                </label>
              </fieldset>
            </div>
          </div>
          <ol id="all-list" class="rows"></ol>
        </section>
      </div>
    </main>

    <!-- include:footer -->

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
