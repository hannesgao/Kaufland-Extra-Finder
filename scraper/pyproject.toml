[project]
name = "kef-scraper"
version = "0.1.0"
description = "Finds Kaufland stores that currently publish an Extra-Angebote leaflet."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pypdf>=6.19.0",
    "requests>=2.34.2",
]

[project.scripts]
kef-scrape = "kef_scraper.cli:run"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-requests>=2.33.0.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF",
    "C4", "DTZ", "PTH", "PT", "S", "BLE", "RET",
]

[tool.ruff.lint.isort]
known-first-party = ["kef_scraper", "conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
