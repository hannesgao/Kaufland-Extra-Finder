version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /scraper
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  # The npm (/web) entry is added once that manifest exists.
