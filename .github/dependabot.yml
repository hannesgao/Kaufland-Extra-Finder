version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /scraper
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # typescript-eslint 8.72 accepts TypeScript < 6.1 only, so TypeScript 7 cannot be installed
      # yet. Remove this once typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  # uv for GitHub Actions (hash-pinned, installed with pip)
  - package-ecosystem: pip
    directory: /.github/uv
    schedule:
      interval: weekly
